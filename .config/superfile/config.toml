theme = "catppuccin-frappe"
editor = "nvim"
dir_editor = "nvim"

auto_check_update = true
cd_on_quit = true

default_open_file_preview = true
show_image_preview = true
show_panel_footer_info = true

default_directory = "."
file_size_use_si = false

default_sort_type = 4
sort_order_reversed = false
case_sensitive_sort = false

shell_close_on_success = false
page_scroll_size = 0

debug = false
ignore_missing_fields = false

file_panel_extra_columns = 0
file_panel_name_percent = 65

code_previewer = ""

nerdfont = true
show_select_icons = true
transparent_background = false

file_preview_width = 3
enable_file_preview_border = true

sidebar_width = 18
sidebar_sections = ["home", "pinned", "disks"]

border_top = "─"
border_bottom = "─"
border_left = "│"
border_right = "│"
border_top_left = "╭"
border_top_right = "╮"
border_bottom_left = "╰"
border_bottom_right = "╯"
border_middle_left = "├"
border_middle_right = "┤"

metadata = false
enable_md5_checksum = false
zoxide_support = true

[open_with]
pdf = "xdg-open"
png = "xdg-open"
jpg = "xdg-open"
jpeg = "xdg-open"
gif = "xdg-open"
webp = "xdg-open"
mp4 = "xdg-open"
mkv = "xdg-open"
mp3 = "xdg-open"
ogg = "xdg-open"