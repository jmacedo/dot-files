# KITTY CONFIGURATION

include themes/catppuccin-frappe.kitty.conf

# Fonts
font_family SauceCodePro NF
font_size 12.0
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Symbols Nerd Font Mono

# Window
hide_window_decorations no
draw_minimal_borders yes
draw_window_borders_for_single_window no
wayland_titlebar_color system
window_border_width 1pt
window_margin_width 0
window_padding_width 0
background_opacity 1

# Tabs
tab_bar_min_tabs 2
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style bold
inactive_tab_font_style normal

# General
paste_actions quote-urls-at-prompt,confirm-if-large
#mouse_map middle press ungrabbed paste_from_selection
clipboard_control write-clipboard write-primary read-clipboard read-primary
copy_on_select clipboard
enable_audio_bell yes

# KEYBOARD SHORTCUTS

# Tabs
# Navegação = padrão nvim; mover = padrão nvim + Shift.
map ctrl+n new_tab
map ctrl+q close_tab
map ctrl+super+page_up previous_tab
map ctrl+super+page_down next_tab
map ctrl+super+shift+page_up move_tab_backward
map ctrl+super+shift+page_down move_tab_forward
map ctrl+shift+r set_tab_title

# Panels
enabled_layouts splits
map ctrl+alt+h launch --location=vsplit
map ctrl+alt+v launch --location=hsplit
map ctrl+alt+q close_window
map ctrl+alt+up neighboring_window up
map ctrl+alt+down neighboring_window down
map ctrl+alt+left neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+shift+alt+up move_window up
map ctrl+shift+alt+down move_window down
map ctrl+shift+alt+left move_window left
map ctrl+shift+alt+right move_window right
map ctrl+alt+h resize_window narrower 5
map ctrl+alt+l resize_window wider 5
map ctrl+alt+j resize_window shorter 5
map ctrl+alt+k resize_window taller 5

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard