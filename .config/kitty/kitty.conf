# Aparência: Catppuccin Mocha, transparência e molduras mínimas.
font_family Ubuntu Mono
font_size 11.0
symbol_map U+E000-U+F8FF Symbols Nerd Font Mono

background #1e1e2e
background_opacity 0.9
foreground #cdd6f4
selection_foreground #cdd6f4
selection_background #585b70
cursor #f5e0dc
cursor_text_color #1e1e2e

color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #bac2de
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

hide_window_decorations yes
window_border_width 1pt
draw_minimal_borders yes
active_border_color #b4befe
inactive_border_color #45475a
window_margin_width 0
window_padding_width 4

# Exibe a barra de abas mesmo quando há apenas uma aba.
tab_bar_min_tabs 1
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_background #11111b
active_tab_foreground #11111b
active_tab_background #cba6f7
active_tab_font_style bold
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
inactive_tab_font_style normal

# Abas.
map ctrl+n new_tab
map ctrl+w close_tab
map ctrl+page_up previous_tab
map ctrl+page_down next_tab
map ctrl+shift+page_up move_tab_backward
map ctrl+shift+page_down move_tab_forward

# Painéis: H = lado a lado; V = um abaixo do outro.
enabled_layouts splits
map ctrl+alt+h launch --location=vsplit
map ctrl+alt+v launch --location=hsplit

# Navegar entre painéis.
map ctrl+alt+up neighboring_window up
map ctrl+alt+down neighboring_window down
map ctrl+alt+left neighboring_window left
map ctrl+alt+right neighboring_window right

# Mover painéis.
map ctrl+shift+alt+up move_window up
map ctrl+shift+alt+down move_window down
map ctrl+shift+alt+left move_window left
map ctrl+shift+alt+right move_window right
map ctrl+alt+w close_window

# Área de transferência do sistema.
clipboard_control write-clipboard write-primary read-clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
