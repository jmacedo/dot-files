# KITTY CONFIGURATION

include "themes/catppuccin-mocha.kitty.conf"

# Fonts
font_family "Ubuntu Mono"
font_size 11.0
# symbol_map U+E000-U+F8FF "Symbols Nerd Font Mono"
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD "Symbols Nerd Font Mono"

# Window
hide_window_decorations yes
draw_minimal_borders yes
draw_window_borders_for_single_window no
wayland_titlebar_color system
window_border_width 1pt
window_margin_width 0
window_padding_width 4
background_opacity 1

# Tabs
tab_bar_min_tabs 2
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style bold
inactive_tab_font_style normal

# General
paste_actions quote-urls-at-prompt,confirm-if-large
mouse_map middle press ungrabbed paste_from_selection
clipboard_control write-clipboard write-primary read-clipboard read-primary
copy_on_select clipboard
enable_audio_bell yes

# KEYBOARD SHORTCUTS

# Tabs
map ctrl+n new_tab
map ctrl+q close_tab
map ctrl+page_up previous_tab
map ctrl+page_down next_tab
map ctrl+shift+page_up move_tab_backward
map ctrl+shift+page_down move_tab_forward

# Panels
enabled_layouts splits
map ctrl+alt+h launch --location=vsplit
map ctrl+alt+v launch --location=hsplit
map ctrl+alt+up neighboring_window up
map ctrl+alt+down neighboring_window down
map ctrl+alt+left neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+shift+alt+up move_window up
map ctrl+shift+alt+down move_window down
map ctrl+shift+alt+left move_window left
map ctrl+shift+alt+right move_window right
map ctrl+alt+q close_window

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard