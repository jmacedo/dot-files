#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
show_hidden = true
show_symlink = true
scrolloff = 5
linemode = "size"

[preview]
wrap = "no"
tab_size = 2
max_width = 1000
max_height = 900

[input]
cursor_blink = true
