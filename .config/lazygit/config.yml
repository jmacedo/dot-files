confirmOnQuit: false

os:
  edit: "nvim {{filename}}"
  editAtLine: "nvim +{{line}} {{filename}}"
  editAtLineAndWait: "nvim +{{line}} {{filename}}"

gui:
  tabWidth: 4
  mouseEvents: true
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 3
  shrinkSidePanelsToContent: true
  colorTheme: true
  showRandomTip: false
  nerdFontsVersion: "3"

  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#6c7086"
    searchingActiveBorderColor:
      - "#f9e2af"
      - bold
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    inactiveViewSelectedLineBgColor:
      - "#45475a"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#cba6f7"
    markedBaseCommitBgColor:
      - "#45475a"
    markedBaseCommitFgColor:
      - "#f9e2af"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"

git:
  autoFetch: true
  autoRefresh: true
  fetchAll: true
  mainBranches:
    - main
    - master

  commit:
    signOff: false
    autoWrapCommitMessage: true

  diff:
    contextSize: 5
